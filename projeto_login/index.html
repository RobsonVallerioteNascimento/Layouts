<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/mediaQuery.css">
    </head>
    <body>
        <main>
            <section id="login">
                <div id="imagem">
                    <!-- Aqui vai a imagem nas CSS -->
                </div>
                <div id="formulario">
                    <h1>Login</h1>
                    <p>
                        Seja bem-vido(a) novamente. faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
                    </p>
                    <form action="login.php" method="post" autocomplete="on">
                        <div class="campo">
                            <span class="material-symbols-outlined">person</span>
                            <input type="email" name="mailLogin" id="idlogin" placeholder="Seu e-mail" autocomplete="email" required maxlength="30">
                            <label for="idlogin">Login</label>
                        </div>
                        <div class="campo">
                            <span class="material-symbols-outlined">vpn_key</span>
                            <input type="password" name="passSenha" id="idSenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                            <label for="idSenha">Senha</label>
                        </div>
                        <input type="submit" value="entrar">
                        <a href="esqueci.html" class="botao">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                    </form>
                </div>
            </section>
        </main>
    </body>
</html>
